<!DOCTYPE html>

<html><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><meta name="theme-color" content="#6d1732"/><meta name="color-scheme" content="light dark"/><meta name="description" content="Aarti weds Sagar"/><title>Aarti weds Sagar</title><style>
/* Enhancements: rose petals, auto viewing, three-event layout, wedding-card gallery */
html { scroll-behavior: smooth; }
body { overflow-x: hidden; }
.events { grid-template-columns: 1fr; }
@media (min-width:760px){ .events{grid-template-columns:repeat(3,1fr)!important;} }

#petal-layer{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:9998;display:none}
body.invitation-open #petal-layer{display:block}
.rose-petal{position:absolute;top:-12vh;width:18px;height:25px;border-radius:78% 18% 70% 25%;background:radial-gradient(circle at 30% 25%,#ffd6df 0 18%,#dc5973 42%,#9f173d 100%);box-shadow:0 2px 5px rgba(100,27,43,.22);animation:petalFall 14s linear infinite,petalSway 5s ease-in-out infinite alternate}
.rose-petal:nth-child(3n){width:13px;height:19px;opacity:.68;background:radial-gradient(circle at 35% 25%,#ffe7ed,#e78aa0 48%,#b32a50)}
.rose-petal:nth-child(4n){width:21px;height:28px;opacity:.74}
@keyframes petalFall{0%{transform:translate3d(0,-12vh,0) rotate(0deg)}100%{transform:translate3d(40px,112vh,0) rotate(540deg)}}
@keyframes petalSway{0%,100%{margin-left:-25px}50%{margin-left:25px}}
@media (prefers-reduced-motion:reduce){.rose-petal{animation:none;display:none}}

#view-mode{position:fixed;right:14px;bottom:14px;z-index:9999;border:1px solid #d8b968;border-radius:999px;background:#fffaf0eF;color:#6d1732;padding:9px 13px;font:600 12px/1.2 Georgia,serif;box-shadow:0 8px 22px rgba(125,56,85,.18);display:none}
body.invitation-open #view-mode{display:block}

.gallery{gap:22px!important;padding:16px 4px 28px;align-items:center}
.gallery img{background:#fffdf7;border:10px solid #fffdf7;outline:1px solid #d9bc72;border-radius:4px;box-shadow:0 14px 30px #5720372c,0 2px 7px #57203728;object-fit:cover;filter:contrast(1.035) saturate(1.08);}
.gallery img:nth-child(even){transform:rotate(1.1deg)}
.gallery img:first-child{grid-column:1/-1;aspect-ratio:16/10;object-position:center 34%;transform:none}
.gallery img:hover{transform:rotate(0) scale(1.018);box-shadow:0 18px 38px #57203740}
@media(max-width:650px){.gallery{grid-template-columns:1fr!important}.gallery img:first-child{aspect-ratio:4/5}.gallery img{transform:none!important}}
</style><style>
/* Uploaded-photo wedding gallery */
.gallery{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:20px!important;max-width:1050px;margin:0 auto;padding:18px 4px 30px}
.gallery img,.gallery img:first-child{width:100%!important;height:auto!important;aspect-ratio:auto!important;object-fit:contain!important;object-position:center!important;grid-column:auto!important;display:block!important}
.gallery img:nth-child(3n+1){box-shadow:0 16px 34px #57203731,0 2px 8px #57203724}
.gallery img:nth-child(2), .gallery img:nth-child(3), .gallery img:nth-child(4){display:none!important}
@media(min-width:850px){.gallery{grid-template-columns:repeat(3,minmax(0,1fr))!important}.gallery img{height:440px!important;object-fit:cover!important}.gallery img:nth-child(4),.gallery img:nth-child(5),.gallery img:nth-child(6){box-shadow:0 16px 34px #57203731,0 2px 8px #57203724}}
@media(max-width:600px){.gallery{grid-template-columns:1fr!important;max-width:520px}.gallery img{max-height:680px;object-fit:contain!important}}
</style><style id="book-mode-style">
body.bookmode{margin:0;overflow:hidden!important;background:radial-gradient(circle at center,#f8edda 0,#e8d2aa 58%,#b68a52 100%);perspective:1800px}
body.bookmode>section,body.bookmode>footer,body.bookmode>.divider{display:none!important}
#bookShell{position:relative;width:96vw;height:92vh;margin:4vh auto;filter:drop-shadow(0 28px 34px #3f1d1938);z-index:20}
#bookShell:before{content:'';position:absolute;inset:-12px -12px -16px;background:#6d1732;border-radius:10px 20px 20px 10px;box-shadow:inset 0 0 0 3px #b98b3d;z-index:-2}
#bookShell:after{content:'';position:absolute;left:-7px;top:2%;bottom:2%;width:20px;border-radius:12px 0 0 12px;background:linear-gradient(90deg,#451021,#8b2846,#511326);z-index:-1}
.book-page{position:absolute;inset:0;background:#fffaf0;overflow:auto;border-radius:3px 15px 15px 3px;padding:clamp(18px,3vw,42px);transform-origin:left center;backface-visibility:hidden;box-shadow:inset 18px 0 24px rgba(63,29,25,.08),inset -3px 0 2px rgba(150,115,61,.22)}
.book-page.active{opacity:1;pointer-events:auto;transform:rotateY(0) scale(1);z-index:5}
.book-page.turning-out{opacity:0;transform:rotateY(-175deg);z-index:10}
.book-page.turning-in{opacity:0;transform:rotateY(88deg);z-index:9}
.book-page section,.book-page footer{min-height:auto!important;margin:0!important;padding:clamp(10px,2vw,26px)!important;background-color:transparent}
.book-page .hero img,.book-page .story-image-section img,.book-page .bless img{max-height:60vh!important;width:auto!important;max-width:100%!important;object-fit:contain!important}
.book-page .gallery{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:10px!important;padding:6px!important}.book-page .gallery img{height:min(30vh,235px)!important;object-fit:cover!important}
#bookControls{position:fixed;left:50%;bottom:1.5vh;transform:translateX(-50%);z-index:10002;display:flex;align-items:center;gap:10px;background:#fffaf0ee;border:1px solid #c9a55b;border-radius:999px;padding:10px 14px;box-shadow:0 18px 24px rgba(95,45,56,.14)}
#bookControls button{border:0;background:#6d1732;color:#fffaf0;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:16px}#bookTimer{min-width:92px;text-align:center}.book-counter{color:#6d1732;font-weight:700}.book-counter .value{font-family:Georgia,serif}
#view-mode{display:none!important}
@media(max-width:650px){#bookShell{width:96vw;height:92vh;margin:4vh auto}.book-page{padding:14px 10px}.book-page .gallery{grid-template-columns:repeat(2,minmax(0,1fr))!important}.book-page .gallery img{height:min(22vh,190px)!important}}
</style><style id="slower-book-turn">
#bookShell { perspective: 2400px; }
.book-page { transform-style: preserve-3d; backface-visibility: hidden; transition: transform 2.4s cubic-bezier(.42,0,.22,1), opacity 2.1s ease !important; }
.book-page.turning-out { opacity: 1 !important; }
.book-page.turning-in { opacity: 1 !important; }
</style></head><body>
<div id="petal-layer"></div>
<div id="view-mode">View Mode</div>
<section id="opening" class="open">
  <div class="stage-glow"></div>
  <button aria-label="Reveal invitation" class="opening-card-button" onclick="openIt()"><span class="valance"></span><span class="card-label">Open Invitation</span></button>
</section>
<div class="gallery">
  <img src="https://images.unsplash.com/photo-1520854221256-17451cc331bf?auto=format&fit=crop&w=1200&q=80" alt="Wedding Gallery Photograph 1">
  <img src="https://images.unsplash.com/photo-1520854221256-17451cc331bf?auto=format&fit=crop&w=1200&q=80" alt="Wedding Gallery Photograph 2">
  <img src="https://images.unsplash.com/photo-1520854221256-17451cc331bf?auto=format&fit=crop&w=1200&q=80" alt="Wedding Gallery Photograph 3">
  <img src="https://images.unsplash.com/photo-1520854221256-17451cc331bf?auto=format&fit=crop&w=1200&q=80" alt="Wedding Gallery Photograph 4">
  <img src="https://images.unsplash.com/photo-1520854221256-17451cc331bf?auto=format&fit=crop&w=1200&q=80" alt="Wedding Gallery Photograph 5">
</div>
</body></html>
